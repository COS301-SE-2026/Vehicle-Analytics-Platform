name: CI Pipeline

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]


jobs:
  backend_tests:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    continue-on-error: false
    defaults:
      run:
        working-directory: ./backend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: ./backend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint || true

      - name: Run tests with coverage
        run: npm test -- --coverage --coverageDirectory=coverage --passWithNoTests --forceExit

      - name: Show generated coverage files
        run: |
          echo 'Coverage directory listing:'
          ls -la coverage || true
          echo '\nFirst 40 lines of lcov.info (if present):'
          if [ -f coverage/lcov.info ]; then sed -n '1,40p' coverage/lcov.info; else echo 'lcov.info not found'; fi
        shell: bash

      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@v5
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          flags: backend
          directory: ./backend/coverage
          fail_ci_if_error: false

  frontend_tests:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    continue-on-error: false
    defaults:
      run:
        working-directory: ./frontend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: ./frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint || true

      - name: Run tests with coverage
        run: npx jest --coverage --coverageDirectory=coverage --passWithNoTests --forceExit

      - name: Show generated coverage files
        run: |
          echo 'Coverage directory listing:'
          ls -la coverage || true
          echo '\nFirst 40 lines of lcov.info (if present):'
          if [ -f coverage/lcov.info ]; then sed -n '1,40p' coverage/lcov.info; else echo 'lcov.info not found'; fi
        shell: bash

      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@v5
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          flags: frontend
          directory: ./frontend/coverage
          fail_ci_if_error: false

  database_tests:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    continue-on-error: false
    services:
      postgres:
        image: timescale/timescaledb-ha:pg16
        env:
          POSTGRES_DB: fleet_analytics_test
          POSTGRES_USER: admin
          POSTGRES_PASSWORD: testpassword
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    defaults:
      run:
        working-directory: ./database
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: ./database/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Run Database Migrations
        run: |
          sudo apt-get install postgresql-client -y
          for file in $(ls migrations/*.sql | sort -V); do
            echo "Running migration: $file"
            PGPASSWORD=testpassword psql -h localhost -U admin -d fleet_analytics_test -f "$file"
          done

      - name: Run migration tests (with coverage)
        run: npx jest --coverage --coverageDirectory=coverage --runInBand --passWithNoTests --forceExit
        env:
          DB_HOST: localhost
          DB_PORT: 5432
          DB_NAME: fleet_analytics_test
          DB_USER: admin
          DB_PASSWORD: testpassword

      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@v5
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          flags: database
          directory: ./database/coverage
          fail_ci_if_error: false

  deploy_frontend:
    needs:
      - backend_tests
      - frontend_tests
      - database_tests
      
    runs-on: ubuntu-latest

    if: github.event_name == 'push'

    permissions:
      id-token: write
      contents: read
    
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: ./frontend/package-lock.json

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@7474bc4690e29a8392af63c5b98e7449536d5c3a
        with:
          role-to-assume: arn:aws:iam::273949555549:role/github-actions-vehicle-analytics
          aws-region: af-south-1

      - name: Install dependencies
        working-directory: ./frontend
        run: npm ci

      - name: Build frontend
        working-directory: ./frontend
        run: npm run build

      - name: Upload to S3
        run: |
          aws s3 sync frontend/dist s3://kmj2 --delete

      - name: Invalidate CloudFront
        run: |
          aws cloudfront create-invalidation \
            --distribution-id E1PH3LDZUZ8DLL \
            --paths "/*" 