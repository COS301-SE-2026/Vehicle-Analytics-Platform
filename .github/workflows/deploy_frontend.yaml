name: Deploy Frontend

on:
  workflow_run:
    workflows: ["CI Pipeline"]
    types: [completed]

concurrency:
  group: deploy-frontend
  cancel-in-progress: false

jobs:
  deploy_frontend:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    if: >-
      github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.event == 'push' &&
      github.event.workflow_run.head_branch == 'main'

    permissions:
      id-token: write
      contents: read

    environment:
      name: production

    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha }}

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: ./frontend/package-lock.json

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@7474bc4690e29a8392af63c5b98e7449536d5c3a
        with:
          role-to-assume: arn:aws:iam::273949555549:role/github-actions-vehicle-analytics
          aws-region: af-south-1

      - name: Install dependencies
        working-directory: ./frontend
        run: npm ci

      - name: Create .env
        working-directory: ./frontend
        run: |
          echo "VITE_API_URL=${{ vars.VITE_API_URL }}" > .env
          echo "VITE_MAPBOX_TOKEN=${{ secrets.VITE_MAPBOX_TOKEN }}" >> .env

      - name: Build frontend
        working-directory: ./frontend
        run: npm run build

      - name: Upload to S3
        run: aws s3 sync frontend/dist s3://kmj2 --delete

      - name: Invalidate CloudFront
        run: |
          aws cloudfront create-invalidation \
            --distribution-id E1PH3LDZUZ8DLL \
            --paths "/*"