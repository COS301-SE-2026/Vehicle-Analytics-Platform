name: Integration tests

on:
  push:
    branches: [ "main", "develop" ]
  pull_request:
    branches: [ "main", "develop" ]

jobs:
  full_integration_tests:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    services:
      postgres:
        image: timescale/timescaledb-ha:pg16
        env:
          POSTGRES_DB: fleet_analytics_full
          POSTGRES_USER: admin
          POSTGRES_PASSWORD: testpassword
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U admin -d fleet_analytics_full"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10

    env:
      PGHOST: localhost
      PGPORT: 5432
      PGDATABASE: fleet_analytics_full
      PGUSER: admin
      PGPASSWORD: testpassword
      DB_HOST: localhost
      DB_PORT: 5432
      DB_NAME: fleet_analytics_full
      DB_USER: admin
      DB_PASSWORD: testpassword

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: |
            ./database/package-lock.json
            ./backend/package-lock.json

      - name: Install postgresql-client
        run: |
          sudo apt-get update
          sudo apt-get install -y postgresql-client

      - name: Wait for Postgres
        run: |
          for i in $(seq 1 30); do
            pg_isready -q && exit 0
            echo "Waiting for postgres ($i/30)..."
            sleep 2
          done
          echo "Postgres never became ready"; exit 1

      # STEP 1: DATABASE INITIALISATION
      - name: Install database dependencies
        working-directory: ./database
        run: npm ci --ignore-scripts

      - name: Bootstrap stubbed roads & spatial tables
        working-directory: ./database
        run: psql -v ON_ERROR_STOP=1 -f __tests__/bootstrap.sql

      - name: Run core migrations
        working-directory: ./database
        run: |
          set -euo pipefail
          shopt -s nullglob
          files=(migrations/V*.sql)
          if [ ${#files[@]} -eq 0 ]; then
            echo "No migrations found -- wrong working directory?"; exit 1
          fi
          while IFS= read -r file; do
            echo "::group::$file"
            psql -v ON_ERROR_STOP=1 -f "$file"
            echo "::endgroup::"
          done < <(printf '%s\n' "${files[@]}" | sort -V)

      - name: Verify schema applied
        working-directory: ./database
        run: |
          psql -v ON_ERROR_STOP=1 -t -A -c "
            SELECT CASE WHEN
              to_regclass('public.clean_telemetry') IS NOT NULL
              AND EXISTS (SELECT 1 FROM pg_proc WHERE proname = 'safe_lat')
              AND EXISTS (SELECT 1 FROM pg_proc WHERE proname = 'get_vehicle_status')
              AND EXISTS (SELECT 1 FROM pg_proc WHERE proname = 'get_trip_history_with_events')
            THEN 'ok' ELSE 'MISSING' END;" | grep -qx ok

      - name: Seed initial test data
        working-directory: ./database
        run: |
          if [ -f seeds/seed_data.sql ]; then
            psql -v ON_ERROR_STOP=1 -f seeds/seed_data.sql
          else
            echo "No seeds/seed_data.sql; integration fixtures will self-seed."
          fi

      # STEP 2: BACKEND INTEGRATION TESTS (REAL DB, NO MOCKS)
      - name: Install backend dependencies
        working-directory: ./backend
        run: npm ci --ignore-scripts

      - name: Run API integration tests against live Postgres
        working-directory: ./backend
        run: npx --no-install jest --config jest.integration.config.js --ci --coverage --coverageDirectory=coverage-integration
        env:
          NODE_ENV: test
          DB_HOST: localhost
          DB_PORT: 5432
          DB_NAME: fleet_analytics_full
          DB_USER: admin
          DB_PASSWORD: testpassword

      - name: Upload integration coverage to Codecov
        if: always()
        uses: codecov/codecov-action@0fb7174895f61a3b6b78fc075e0cd60383518dac # v5.5.5
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          flags: api-integration
          directory: ./backend/coverage-integration
          fail_ci_if_error: false