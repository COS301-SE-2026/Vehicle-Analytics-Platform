<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 440" width="100%" role="img" aria-label="V.A.P.O.R. - Vehicle Analytics, Processing and Operations in Real-time" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0B0F19" />
      <stop offset="0.6" stop-color="#140D0A" />
      <stop offset="1" stop-color="#2A1206" />
    </linearGradient>
    <linearGradient id="ttl" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#FDBA74" />
      <stop offset="0.5" stop-color="#F97316" />
      <stop offset="1" stop-color="#EA580C" />
    </linearGradient>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M40 0H0V40" fill="none" stroke="#FFFFFF" stroke-opacity="0.04" />
    </pattern>
    <radialGradient id="glow" cx="50%" cy="50%" r="50%">
      <stop offset="0" stop-color="#F97316" stop-opacity="0.45" />
      <stop offset="1" stop-color="#F97316" stop-opacity="0" />
    </radialGradient>
    <clipPath id="outer"><rect width="1200" height="440" rx="18" /></clipPath>
    <clipPath id="tick"><rect x="92" y="396" width="1108" height="44" /></clipPath>
    <path id="r1" d="M-20 330 C 150 280, 260 380, 430 320 S 700 250, 860 300 S 1100 360, 1220 280" />
    <path id="r2" d="M-20 120 C 180 160, 300 60, 520 110 S 760 200, 920 150 S 1120 60, 1220 100" />
    <path id="r3" d="M300 -20 C 340 100, 280 220, 380 300 S 520 400, 560 460" />
  </defs>

  <g clip-path="url(#outer)">
    <rect width="1200" height="440" fill="url(#bg)" />
    <rect width="1200" height="440" fill="url(#grid)" />
    <circle cx="1000" cy="150" r="320" fill="url(#glow)" opacity="0.5" />
    <circle cx="120" cy="420" r="260" fill="url(#glow)" opacity="0.35" />

    <!-- Routes -->
    <use href="#r1" fill="none" stroke="#F97316" stroke-opacity="0.18" stroke-width="2" />
    <use href="#r2" fill="none" stroke="#F97316" stroke-opacity="0.18" stroke-width="2" />
    <use href="#r3" fill="none" stroke="#F97316" stroke-opacity="0.18" stroke-width="2" />
    <use href="#r1" fill="none" stroke="#FDBA74" stroke-opacity="0.5" stroke-width="1.5" stroke-dasharray="3 11">
      <animate attributeName="stroke-dashoffset" from="0" to="-28" dur="2s" repeatCount="indefinite" />
    </use>
    <use href="#r2" fill="none" stroke="#FDBA74" stroke-opacity="0.5" stroke-width="1.5" stroke-dasharray="3 11">
      <animate attributeName="stroke-dashoffset" from="0" to="-28" dur="2s" repeatCount="indefinite" />
    </use>
    <use href="#r3" fill="none" stroke="#FDBA74" stroke-opacity="0.5" stroke-width="1.5" stroke-dasharray="3 11">
      <animate attributeName="stroke-dashoffset" from="0" to="-28" dur="2s" repeatCount="indefinite" />
    </use>

    <!-- Vehicles -->
    <g>
      <circle r="16" fill="url(#glow)" />
      <circle r="4.5" fill="#F97316" />
      <circle r="4.5" fill="none" stroke="#F97316" stroke-width="1.5">
        <animate attributeName="r" values="4.5;18" dur="2s" repeatCount="indefinite" />
        <animate attributeName="opacity" values="0.8;0" dur="2s" repeatCount="indefinite" />
      </circle>
      <animateMotion dur="14s" begin="-4s" repeatCount="indefinite"><mpath href="#r1" /></animateMotion>
    </g>
    <g>
      <circle r="16" fill="url(#glow)" />
      <circle r="4.5" fill="#F97316" />
      <circle r="4.5" fill="none" stroke="#F97316" stroke-width="1.5">
        <animate attributeName="r" values="4.5;18" dur="2s" begin="-1s" repeatCount="indefinite" />
        <animate attributeName="opacity" values="0.8;0" dur="2s" begin="-1s" repeatCount="indefinite" />
      </circle>
      <animateMotion dur="14s" begin="-11s" repeatCount="indefinite"><mpath href="#r1" /></animateMotion>
    </g>
    <g>
      <circle r="16" fill="url(#glow)" />
      <circle r="4.5" fill="#FDBA74" />
      <circle r="4.5" fill="none" stroke="#FDBA74" stroke-width="1.5">
        <animate attributeName="r" values="4.5;18" dur="2s" repeatCount="indefinite" />
        <animate attributeName="opacity" values="0.8;0" dur="2s" repeatCount="indefinite" />
      </circle>
      <animateMotion dur="17s" begin="-2s" repeatCount="indefinite"><mpath href="#r2" /></animateMotion>
    </g>
    <g>
      <circle r="16" fill="url(#glow)" />
      <circle r="4.5" fill="#EF4444" />
      <circle r="4.5" fill="none" stroke="#EF4444" stroke-width="1.5">
        <animate attributeName="r" values="4.5;18" dur="1.2s" repeatCount="indefinite" />
        <animate attributeName="opacity" values="0.9;0" dur="1.2s" repeatCount="indefinite" />
      </circle>
      <animateMotion dur="17s" begin="-12s" repeatCount="indefinite"><mpath href="#r2" /></animateMotion>
    </g>
    <g>
      <circle r="16" fill="url(#glow)" />
      <circle r="4.5" fill="#F97316" />
      <circle r="4.5" fill="none" stroke="#F97316" stroke-width="1.5">
        <animate attributeName="r" values="4.5;18" dur="2s" begin="-0.5s" repeatCount="indefinite" />
        <animate attributeName="opacity" values="0.8;0" dur="2s" begin="-0.5s" repeatCount="indefinite" />
      </circle>
      <animateMotion dur="9s" begin="-3s" repeatCount="indefinite"><mpath href="#r3" /></animateMotion>
    </g>

    <!-- Left: title block -->
    <g>
      <animate attributeName="opacity" from="0" to="1" dur="1s" fill="freeze" />
      <rect x="70" y="84" width="214" height="28" rx="14" fill="#F97316" fill-opacity="0.12" stroke="#F97316" stroke-opacity="0.45" />
      <circle cx="90" cy="98" r="4" fill="#22C55E">
        <animate attributeName="opacity" values="1;0.25;1" dur="1.6s" repeatCount="indefinite" />
      </circle>
      <text x="104" y="102" font-family="'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="11" font-weight="700" letter-spacing="2" fill="#FDBA74">LIVE FLEET TELEMETRY</text>

      <text x="68" y="205" font-family="'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="92" font-weight="800" letter-spacing="4" fill="url(#ttl)">V.A.P.O.R.</text>
      <text x="72" y="248" font-family="'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="19" font-weight="600" fill="#FDBA74">Vehicle Analytics, Processing and Operations in Real-time</text>
      <text x="72" y="282" font-family="'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="15" fill="#94A3B8" letter-spacing="1">Stream  /  Detect  /  Forecast  /  Prevent</text>

      <g font-family="'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="12" font-weight="600" fill="#FDBA74" text-anchor="middle">
        <rect x="70" y="304" width="84" height="28" rx="14" fill="#F97316" fill-opacity="0.08" stroke="#F97316" stroke-opacity="0.4" /><text x="112" y="322">Kinesis</text>
        <rect x="164" y="304" width="80" height="28" rx="14" fill="#F97316" fill-opacity="0.08" stroke="#F97316" stroke-opacity="0.4" /><text x="204" y="322">Lambda</text>
        <rect x="254" y="304" width="118" height="28" rx="14" fill="#F97316" fill-opacity="0.08" stroke="#F97316" stroke-opacity="0.4" /><text x="313" y="322">TimescaleDB</text>
        <rect x="382" y="304" width="70" height="28" rx="14" fill="#F97316" fill-opacity="0.08" stroke="#F97316" stroke-opacity="0.4" /><text x="417" y="322">React</text>
        <rect x="462" y="304" width="82" height="28" rx="14" fill="#F97316" fill-opacity="0.08" stroke="#F97316" stroke-opacity="0.4" /><text x="503" y="322">Mapbox</text>
      </g>
    </g>

    <!-- Right: live panel -->
    <g font-family="'Segoe UI',Roboto,Helvetica,Arial,sans-serif">
      <rect x="790" y="60" width="350" height="210" rx="16" fill="#0F172A" fill-opacity="0.85" stroke="#F97316" stroke-opacity="0.35" />
      <text x="812" y="92" font-size="13" font-weight="700" fill="#E5E7EB">Fleet Overview</text>
      <circle cx="1090" cy="88" r="4" fill="#22C55E"><animate attributeName="opacity" values="1;0.25;1" dur="1.6s" repeatCount="indefinite" /></circle>
      <text x="1100" y="92" font-size="10" font-weight="700" letter-spacing="1.5" fill="#22C55E">LIVE</text>

      <text x="812" y="124" font-size="10" letter-spacing="1" fill="#94A3B8">ACTIVE VEHICLES</text>
      <text x="812" y="150" font-size="24" font-weight="800" fill="#FFFFFF">100+</text>
      <text x="960" y="124" font-size="10" letter-spacing="1" fill="#94A3B8">MAP REFRESH</text>
      <text x="960" y="150" font-size="24" font-weight="800" fill="#FFFFFF">5-10 s</text>

      <g stroke="#FFFFFF" stroke-opacity="0.07">
        <line x1="812" y1="175" x2="1118" y2="175" /><line x1="812" y1="205" x2="1118" y2="205" /><line x1="812" y1="235" x2="1118" y2="235" />
      </g>
      <path d="M812 230 L840 215 L868 222 L896 195 L924 205 L952 180 L980 200 L1008 188 L1036 210 L1064 178 L1092 190 L1118 172"
            fill="none" stroke="#F97316" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" pathLength="100" stroke-dasharray="100" stroke-dashoffset="100">
        <animate attributeName="stroke-dashoffset" values="100;0;0" keyTimes="0;0.6;1" dur="6s" repeatCount="indefinite" />
      </path>
      <circle cx="1118" cy="172" r="4" fill="#FDBA74"><animate attributeName="opacity" values="0;0;1;1;0" keyTimes="0;0.55;0.65;0.95;1" dur="6s" repeatCount="indefinite" /></circle>
      <text x="812" y="258" font-size="10" fill="#64748B">Speed (km/h)</text>
    </g>

    <!-- Alert toasts -->
    <g font-family="'Segoe UI',Roboto,Helvetica,Arial,sans-serif">
      <g opacity="0">
        <animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.05;0.1;0.45;0.5;1" dur="16s" repeatCount="indefinite" />
        <rect x="790" y="290" width="350" height="56" rx="12" fill="#1F1410" stroke="#EF4444" stroke-opacity="0.6" />
        <path d="M816 305 L830 330 L802 330 Z" fill="#F59E0B" />
        <rect x="815" y="312" width="2" height="9" fill="#1F1410" /><rect x="815" y="323" width="2" height="2" fill="#1F1410" />
        <text x="846" y="314" font-size="14" font-weight="700" fill="#FFFFFF">Harsh braking detected</text>
        <text x="846" y="333" font-size="11" fill="#94A3B8">VEH-027 &#183; just now</text>
      </g>
      <g opacity="0">
        <animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.5;0.55;0.9;0.95;1" dur="16s" repeatCount="indefinite" />
        <rect x="790" y="290" width="350" height="56" rx="12" fill="#10161F" stroke="#F97316" stroke-opacity="0.6" />
        <circle cx="816" cy="318" r="12" fill="none" stroke="#F97316" stroke-width="2" />
        <circle cx="816" cy="318" r="4" fill="#F97316" />
        <text x="846" y="314" font-size="14" font-weight="700" fill="#FFFFFF">Geofence entry: Depot A</text>
        <text x="846" y="333" font-size="11" fill="#94A3B8">VEH-041 &#183; just now</text>
      </g>
    </g>

    <!-- Ticker -->
    <rect y="396" width="1200" height="44" fill="#000000" fill-opacity="0.5" />
    <line x1="0" y1="396" x2="1200" y2="396" stroke="#F97316" stroke-opacity="0.35" />
    <g clip-path="url(#tick)" font-family="'JetBrains Mono','SFMono-Regular',Consolas,'Liberation Mono',monospace" font-size="13" fill="#FDBA74">
      <g>
        <animateTransform attributeName="transform" type="translate" from="0 0" to="-1200 0" dur="32s" repeatCount="indefinite" />
        <text x="104" y="423" textLength="1180" lengthAdjust="spacing" xml:space="preserve">&#9679; VEH-014 &#183; 62 km/h &#183; SAFE    &#9679; VEH-027 &#183; HARSH BRAKING    &#9679; VEH-003 &#183; SPEEDING 118 km/h    &#9679; VEH-041 &#183; GEOFENCE ENTRY    &#9679; VEH-009 &#183; SCORE 94</text>
        <text x="1304" y="423" textLength="1180" lengthAdjust="spacing" xml:space="preserve">&#9679; VEH-014 &#183; 62 km/h &#183; SAFE    &#9679; VEH-027 &#183; HARSH BRAKING    &#9679; VEH-003 &#183; SPEEDING 118 km/h    &#9679; VEH-041 &#183; GEOFENCE ENTRY    &#9679; VEH-009 &#183; SCORE 94</text>
      </g>
    </g>
    <rect x="0" y="396" width="92" height="44" fill="#F97316" />
    <text x="46" y="423" text-anchor="middle" font-family="'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="13" font-weight="800" letter-spacing="2" fill="#1A0A02">LIVE</text>
  </g>
</svg>
