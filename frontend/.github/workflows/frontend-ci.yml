name: Frontend CI/CD

on:
  push:
    branches: [ develop, main, feature/* ]
    paths:
      - 'frontend/**'
  pull_request:
    branches: [ develop, main ]
    paths:
      - 'frontend/**'

jobs:
  test:
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: ./frontend

    strategy:
      matrix:
        node-version: [20.x]

    steps:
    - uses: actions/checkout@v4
    
    - name: Use Node.js ${{ matrix.node-version }}
      uses: actions/setup-node@v4
      with:
        node-version: ${{ matrix.node-version }}
        cache: 'npm'
        cache-dependency-path: frontend/package-lock.json
    
    - name: Install dependencies
      run: npm ci
    
    - name: Run linter
      run: npm run lint -- --max-warnings 0 || true
    
    - name: Run tests with coverage (80% threshold)
      run: npm run test -- --coverage --maxWorkers=2
    
    - name: Upload coverage report
      uses: actions/upload-artifact@v4
      with:
        name: frontend-coverage-report
        path: frontend/coverage/
        retention-days: 7

  build:
    needs: test
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: ./frontend

    steps:
    - uses: actions/checkout@v4
    
    - name: Use Node.js
      uses: actions/setup-node@v4
      with:
        node-version: 20.x
        cache: 'npm'
        cache-dependency-path: frontend/package-lock.json
    
    - name: Install dependencies
      run: npm ci
    
    - name: Build frontend
      run: npm run build
    
    - name: Upload build artifact
      uses: actions/upload-artifact@v4
      with:
        name: frontend-build-output
        path: frontend/dist/
        retention-days: 7

  # Optional: Deploy to preview environment
  deploy-preview:
    needs: build
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    
    defaults:
      run:
        working-directory: ./frontend
    
    steps:
    - uses: actions/checkout@v4
    
    - name: Download build artifact
      uses: actions/download-artifact@v4
      with:
        name: frontend-build-output
        path: frontend/dist/
    
    - name: Deploy to preview (example - you can replace with your deployment)
      run: |
        echo "Deploying frontend preview..."
        echo "Build is ready in ./frontend/dist/"
        # Add your deployment command here
        # Example: npx vercel --preview --token ${{ secrets.VERCEL_TOKEN }}
